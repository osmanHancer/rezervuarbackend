<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hurjet Rezervuar - Monitoring (A / B / C)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .channel-panel {
            background: #f8fafc;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .channel-header {
            padding: 16px 20px;
            color: white;
            text-align: center;
        }

        .channel-header h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .channel-a .channel-header { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .channel-b .channel-header { background: linear-gradient(135deg, #059669, #047857); }
        .channel-c .channel-header { background: linear-gradient(135deg, #d97706, #b45309); }
        .channel-d .channel-header { background: linear-gradient(135deg, #7c3aed, #6d28d9); }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .status-online { background: #10b981; color: white; }
        .status-offline { background: #ef4444; color: white; }
        .status-no_data { background: #f59e0b; color: white; }

        .panel-body {
            padding: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.9rem;
        }

        .info-row:last-child { border-bottom: none; }

        .info-label { color: #6b7280; font-weight: 600; }
        .info-value { color: #1f2937; font-weight: 500; }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .sensor-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .sensor-title {
            font-size: 0.7rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .sensor-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1f2937;
        }

        .sensor-unit {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .panel-error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            margin: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
        }

        .footer-note {
            text-align: center;
            color: white;
            font-size: 0.85rem;
            margin-top: 20px;
            opacity: 0.85;
        }

        @media (max-width: 1100px) {
            .channels-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📊 Hurjet Rezervuar Monitoring</h1>
        </div>

        <div class="channels-grid" id="channels-grid"></div>

        <div class="footer-note">
            Her kanal kendi API'sinden okunur: <code>/api/a/status</code>, <code>/api/b/status</code>, <code>/api/c/status</code>, <code>/api/d/status</code> — 2 saniyede bir güncellenir
        </div>
    </div>

    <script>
        // /rezervuar/monitoring gibi alt path'te çalışırken API base'i doğru hesapla
        const API_BASE = window.location.origin +
            window.location.pathname.replace(/\/?monitoring\/?$/, '').replace(/\/$/, '');
        const CHANNELS = [
            { id: 'a', label: 'Hürjet A', db: 'hurjet_rezervuar_a' },
            { id: 'b', label: 'Hürjet B', db: 'hurjet_rezervuar_b' },
            { id: 'c', label: 'Hürkuş ', db: 'hurkus_rezervuar_c' },
            { id: 'd', label: 'Gökbey', db: 'gokbey_rezervuar_d' },
        ];

        const errorCounts = { a: 0, b: 0, c: 0, d: 0 };

        function formatValue(value) {
            if (value === null || value === undefined) return '-';
            return typeof value === 'number' ? value.toFixed(2) : value;
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            return new Date(dateString).toLocaleString('tr-TR');
        }

        function statusLabel(status) {
            if (status === 'online') return 'Çevrimiçi';
            if (status === 'offline') return 'Çevrimdışı';
            return 'Veri Yok';
        }

        function createPanel(channel) {
            const ch = channel.id;
            return `
                <div class="channel-panel channel-${ch}" id="panel-${ch}">
                    <div class="channel-header">
                        <h2>${channel.label}</h2>
                        <div class="status-badge status-no_data" id="badge-${ch}">Yükleniyor...</div>
                        <div style="font-size:0.75rem;margin-top:6px;opacity:0.9">${channel.db}</div>
                    </div>
                    <div class="panel-error" id="error-${ch}">Backend'e bağlanılamadı</div>
                    <div class="panel-body" id="body-${ch}">
                        <div class="info-row">
                            <span class="info-label">Port</span>
                            <span class="info-value" id="port-${ch}">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Cycle</span>
                            <span class="info-value" id="cycle-${ch}">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Son güncelleme</span>
                            <span class="info-value" id="lastUpdate-${ch}">-</span>
                        </div>
                        <div class="sensor-grid">
                            <div class="sensor-card">
                                <div class="sensor-title">Rezervuar</div>
                                <div class="sensor-value" id="rezervuar-${ch}">-</div>
                                <div class="sensor-unit">Litre</div>
                            </div>
                            <div class="sensor-card">
                                <div class="sensor-title">Yüksek basınç</div>
                                <div class="sensor-value" id="highPressure-${ch}">-</div>
                                <div class="sensor-unit">Bar</div>
                            </div>
                            <div class="sensor-card">
                                <div class="sensor-title">Düşük basınç</div>
                                <div class="sensor-value" id="lowPressure-${ch}">-</div>
                                <div class="sensor-unit">Bar</div>
                            </div>
                            <div class="sensor-card">
                                <div class="sensor-title">Ortam sıcaklığı</div>
                                <div class="sensor-value" id="ambientTemp-${ch}">-</div>
                                <div class="sensor-unit">°C</div>
                            </div>
                            <div class="sensor-card">
                                <div class="sensor-title">Hidrolik sıcaklık</div>
                                <div class="sensor-value" id="hydraulicTemp-${ch}">-</div>
                                <div class="sensor-unit">°C</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById('channels-grid').innerHTML =
            CHANNELS.map(createPanel).join('');

        async function fetchChannelStatus(channelId) {
            const ch = channelId;
            try {
                const response = await fetch(`${API_BASE}/api/${ch}/status`);
                if (!response.ok) throw new Error('Network error');

                const result = await response.json();
                errorCounts[ch] = 0;

                document.getElementById(`error-${ch}`).style.display = 'none';
                document.getElementById(`body-${ch}`).style.display = 'block';

                const badge = document.getElementById(`badge-${ch}`);
                badge.className = 'status-badge status-' + (result.status || 'no_data');
                badge.textContent = statusLabel(result.status);

                if (result.data) {
                    document.getElementById(`port-${ch}`).textContent = result.data.port || '-';
                    document.getElementById(`cycle-${ch}`).textContent = result.data.cycle ?? '-';
                    document.getElementById(`lastUpdate-${ch}`).textContent = formatDate(result.lastUpdate);
                    document.getElementById(`rezervuar-${ch}`).textContent =
                        formatValue(result.data.rezervuarLitre != null ? result.data.rezervuarLitre / 100 : null);
                    document.getElementById(`highPressure-${ch}`).textContent =
                        formatValue(result.data.highPressure);
                    document.getElementById(`lowPressure-${ch}`).textContent =
                        formatValue(result.data.lowPressure != null ? result.data.lowPressure / 10 : null);
                    document.getElementById(`ambientTemp-${ch}`).textContent =
                        formatValue(result.data.ambientTemperature != null ? result.data.ambientTemperature / 10 : null);
                    document.getElementById(`hydraulicTemp-${ch}`).textContent =
                        formatValue(result.data.hydraulicTemperature != null ? result.data.hydraulicTemperature / 10 : null);
                }
            } catch (error) {
                console.error(`Kanal ${ch} fetch error:`, error);
                errorCounts[ch]++;

                if (errorCounts[ch] > 2) {
                    document.getElementById(`error-${ch}`).style.display = 'block';
                    document.getElementById(`body-${ch}`).style.display = 'none';
                    const badge = document.getElementById(`badge-${ch}`);
                    badge.className = 'status-badge status-offline';
                    badge.textContent = 'Bağlantı hatası';
                }
            }
        }

        function refreshAll() {
            CHANNELS.forEach((c) => fetchChannelStatus(c.id));
        }

        refreshAll();
        setInterval(refreshAll, 2000);
    </script>
</body>

</html>
